# Workflow Timing Assumptions (seconds)
# Benchmarks sourced from Spinsci.ai (AHT) and Dialog Health (FCR)
workflow_stages:
  member_verification:
    traditional: 45
    ai_assisted: 10
  claim_lookup:
    traditional: 60
    ai_assisted: 5
  coverage_lookup:
    traditional: 90
    ai_assisted: 15
  prior_auth_verification:
    traditional: 120
    ai_assisted: 20
  roi_verification:
    traditional: 45
    ai_assisted: 5
  claim_explanation:
    traditional: 180
    ai_assisted: 45
  recommended_next_actions:
    traditional: 60
    ai_assisted: 10

# Business Impact Assumptions
# Cost based on fully burdened rate for specialized healthcare agents ($42/hr)
# Stats derived from synthetic dataset analysis:
# - Avg Transcript Duration: 385s (Max 720s)
# - Denial Rate: 24.1%
# - Preventable (Fixable) Denials: 73.6%
# - ROI Expiration Rate: 12.2%
impact_assumptions:
  fcr_improvement_pct: 25          # Target: 77% (Derived from FCR potential in data)
  repeat_call_reduction_pct: 20    # Based on 73.6% fixable denial rate automation
  preventable_denials_reduction_pct: 18 # Target reduction in the 73.6% fixable segment
  stars_gap_closure_improvement: 4.0 # Percentage point improvement in key STARs measures
  annual_call_volume: 1200000      # Specialized Desk Estimate
  cost_per_second: 0.01166         # Fully burdened agent cost ($42/hr)
