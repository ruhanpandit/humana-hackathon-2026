<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Humana Resolve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; display: flex; flex-direction: column; height: 100vh; }

    header { background: #0f172a; color: #fff; padding: 1rem 1.5rem; font-weight: 600; font-size: 1rem; }

    #messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

    .bubble { max-width: 70%; padding: .75rem 1rem; border-radius: 1rem; font-size: .9rem; line-height: 1.5; white-space: pre-wrap; }
    .bubble.user { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: .25rem; }
    .bubble.agent { align-self: flex-start; background: #fff; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: .25rem; }
    .bubble.thinking { color: #94a3b8; font-style: italic; }

    #input-row { display: flex; gap: .75rem; padding: 1rem 1.5rem; background: #fff; border-top: 1px solid #e2e8f0; }
    #input-row textarea { flex: 1; border: 1px solid #cbd5e1; border-radius: .5rem; padding: .6rem .9rem;
                          font-size: .9rem; resize: none; height: 48px; font-family: inherit; outline: none; }
    #input-row textarea:focus { border-color: #0284c7; }
    #input-row button { background: #0284c7; color: #fff; border: none; border-radius: .5rem;
                        padding: 0 1.25rem; font-weight: 600; cursor: pointer; font-size: .9rem; }
    #input-row button:hover { background: #0369a1; }
    #input-row button:disabled { background: #94a3b8; cursor: default; }
  </style>
</head>
<body>
  <header>Humana Resolve</header>

  <div id="messages">
    <div class="bubble agent">Hi! I'm the Humana Resolve AI assistant. Ask me about a claim, benefits, coverage, or anything else I can help with.</div>
  </div>

  <div id="input-row">
    <textarea id="input" placeholder="Type a message… (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send-btn" onclick="send()">Send</button>
  </div>

  <script>
    let sessionId = null;

    const input   = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const msgs    = document.getElementById('messages');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = `bubble ${role}`;
      div.textContent = text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      sendBtn.disabled = true;
      addBubble('user', text);
      const thinking = addBubble('agent thinking', 'Thinking…');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const data = await res.json();
        sessionId = data.session_id;
        thinking.textContent = data.reply;
        thinking.classList.remove('thinking');
      } catch (e) {
        thinking.textContent = 'Error: could not reach the server.';
      }

      sendBtn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
