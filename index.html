<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Humana Resolve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #eef2f7; display: flex; flex-direction: column; height: 100vh; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #052e16 0%, #14532d 100%);
      color: #fff;
      padding: .85rem 1.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 3px solid #16a34a;
      flex-shrink: 0;
    }
    .header-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(22,163,74,.4);
    }
    .header-text { display: flex; flex-direction: column; }
    .header-text .name { font-weight: 700; font-size: 1rem; letter-spacing: .01em; }
    .header-text .sub  { font-size: .68rem; color: #86efac; font-weight: 400; margin-top: .1rem; letter-spacing: .04em; text-transform: uppercase; }

    /* ── Messages ── */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 1.75rem 1.75rem 1rem;
      display: flex; flex-direction: column; gap: 1.1rem;
      background: #eef2f7;
    }
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #c8d5e3; border-radius: 10px; }

    /* ── Bubbles ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .bubble {
      max-width: 72%;
      padding: .8rem 1.1rem;
      border-radius: 1.2rem;
      font-size: .9rem; line-height: 1.65; white-space: pre-wrap;
      animation: fadeUp .18s ease-out;
    }
    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #15803d 0%, #166534 100%);
      color: #fff;
      border-bottom-right-radius: .3rem;
      box-shadow: 0 4px 14px rgba(21,128,61,.3);
    }
    .bubble.agent {
      align-self: flex-start;
      background: #fff;
      color: #1e293b;
      border-bottom-left-radius: .3rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      border-left: 3px solid #16a34a;
    }
    .bubble.thinking {
      color: #94a3b8; font-style: italic;
      border-left-color: #cbd5e1;
    }

    /* ── Input row ── */
    #input-row {
      display: flex; gap: .75rem;
      padding: .9rem 1.5rem;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      box-shadow: 0 -4px 20px rgba(0,0,0,.06);
      align-items: center;
    }
    #input-row textarea {
      flex: 1;
      border: 1.5px solid #cbd5e1;
      border-radius: .8rem;
      padding: .65rem 1rem;
      font-size: .9rem; resize: none; height: 48px;
      font-family: inherit; outline: none;
      background: #f8fafc; color: #1e293b;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    #input-row textarea:focus {
      border-color: #15803d;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(21,128,61,.12);
    }
    #input-row button {
      background: linear-gradient(135deg, #15803d, #166534);
      color: #fff; border: none; border-radius: .8rem;
      padding: 0 1.35rem; font-weight: 600; cursor: pointer;
      font-size: .9rem; height: 48px;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 2px 8px rgba(21,128,61,.3);
    }
    #input-row button:hover  { opacity: .92; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(21,128,61,.35); }
    #input-row button:active { transform: translateY(0); }
    #input-row button:disabled { background: linear-gradient(135deg, #94a3b8, #64748b); box-shadow: none; cursor: default; transform: none; opacity: 1; }

    /* ── Mic button ── */
    #mic-btn {
      width: 48px; padding: 0; font-size: 1.2rem; flex-shrink: 0;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      transition: opacity .15s, transform .1s;
    }
    #mic-btn:hover { opacity: .85; transform: translateY(-1px); }
    #mic-btn.recording {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      animation: pulse-red 1s ease-in-out infinite;
    }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,.55); }
      50%       { box-shadow: 0 0 0 9px rgba(220,38,38,0); }
    }

    /* ── Voice status ── */
    #voice-status {
      font-size: .72rem; color: #64748b;
      padding: .15rem .5rem; white-space: nowrap;
      font-style: italic; min-width: 72px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-icon">🩺</div>
    <div class="header-text">
      <span class="name">Humana Resolve</span>
      <span class="sub">AI Claims Assistant</span>
    </div>
  </header>

  <div id="messages">
    <div class="bubble agent">Hi! I'm the Humana Resolve AI assistant. Ask me about a claim, benefits, coverage, or anything else I can help with.</div>
  </div>

  <div id="input-row">
    <textarea id="input" placeholder="Type a message… (Enter to send, Shift+Enter for new line)"></textarea>
    <span id="voice-status"></span>
    <button id="mic-btn" title="Start voice input">🎤</button>
    <button id="send-btn" onclick="send()">Send</button>
  </div>

  <script>
    let sessionId     = null;
    let isRecording   = false;
    let mediaRecorder = null;
    let audioChunks   = [];
    let audioCtx      = null;   // Web Audio API context — unlocked on first gesture

    const input      = document.getElementById('input');
    const sendBtn    = document.getElementById('send-btn');
    const micBtn     = document.getElementById('mic-btn');
    const voiceStat  = document.getElementById('voice-status');
    const msgs       = document.getElementById('messages');

    // Must be called inside a user-gesture handler so the AudioContext is
    // granted autoplay permission. Once unlocked it stays unlocked forever,
    // even across async boundaries like fetch().
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    // ── Mic recording ────────────────────────────────────────────────────────
    micBtn.addEventListener('click', toggleRecording);

    async function toggleRecording() {
      unlockAudio(); // called synchronously inside the click handler
      if (isRecording) {
        mediaRecorder.stop();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks  = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          setRecording(false);
          await processAudio(new Blob(audioChunks, { type: 'audio/webm;codecs=opus' }));
        };
        mediaRecorder.start();
        setRecording(true);
      } catch {
        alert('Microphone access denied. Please allow mic access and try again.');
      }
    }

    function setRecording(val) {
      isRecording = val;
      micBtn.classList.toggle('recording', val);
      micBtn.title = val ? 'Stop recording' : 'Start voice input';
      setStatus(val ? 'Listening…' : '');
    }

    async function processAudio(blob) {
      setStatus('Transcribing…');
      micBtn.disabled = true;
      try {
        const fd = new FormData();
        fd.append('audio', blob, 'recording.webm');
        const res  = await fetch('/stt', { method: 'POST', body: fd });
        const data = await res.json();
        const text = data.transcript?.trim();
        if (text) {
          await send(text);
        } else {
          setStatus('No speech detected');
          setTimeout(() => setStatus(''), 2000);
        }
      } catch {
        addBubble('agent', 'Error: could not transcribe audio.');
        setStatus('');
      }
      micBtn.disabled = false;
    }

    // ── TTS playback — edge-tts neural voice via /tts endpoint ──────────────
    async function speakText(text) {
      setStatus('Speaking…');
      try {
        const res = await fetch('/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) { setStatus(''); return; }
        const buf     = await res.arrayBuffer();
        const decoded = await audioCtx.decodeAudioData(buf);
        const src     = audioCtx.createBufferSource();
        src.buffer    = decoded;
        src.connect(audioCtx.destination);
        src.onended   = () => setStatus('');
        src.start(0);
      } catch (e) {
        console.error('TTS error:', e);
        setStatus('');
      }
    }

    function setStatus(msg) { voiceStat.textContent = msg; }

    // ── Chat ─────────────────────────────────────────────────────────────────
    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = `bubble ${role}`;
      div.textContent = text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    async function send(overrideText) {
      unlockAudio(); // unlock on Send button click too
      const text = overrideText ?? input.value.trim();
      if (!text) return;

      if (!overrideText) input.value = '';
      sendBtn.disabled = true;
      addBubble('user', text);
      const thinking = addBubble('agent thinking', 'Thinking…');
      setStatus('Thinking…');

      try {
        const res  = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const data = await res.json();
        sessionId = data.session_id;
        thinking.textContent = data.reply;
        thinking.classList.remove('thinking');
        await speakText(data.reply);
      } catch {
        thinking.textContent = 'Error: could not reach the server.';
        setStatus('');
      }

      sendBtn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
