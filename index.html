<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Humana Resolve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; display: flex; flex-direction: column; height: 100vh; }

    header { background: #0f172a; color: #fff; padding: .75rem 1.5rem; font-weight: 600; font-size: 1rem;
             display: flex; align-items: center; justify-content: space-between; gap: 1rem; }

    #messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

    .bubble { max-width: 70%; padding: .75rem 1rem; border-radius: 1rem; font-size: .9rem; line-height: 1.5; white-space: pre-wrap; }
    .bubble.user { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: .25rem; }
    .bubble.agent { align-self: flex-start; background: #fff; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: .25rem; }
    .bubble.thinking { color: #94a3b8; font-style: italic; }

    #input-row { display: flex; gap: .75rem; padding: 1rem 1.5rem; background: #fff; border-top: 1px solid #e2e8f0; align-items: center; }
    #input-row textarea { flex: 1; border: 1px solid #cbd5e1; border-radius: .5rem; padding: .6rem .9rem;
                          font-size: .9rem; resize: none; height: 48px; font-family: inherit; outline: none; }
    #input-row textarea:focus { border-color: #0284c7; }
    #input-row button { background: #0284c7; color: #fff; border: none; border-radius: .5rem;
                        padding: 0 1.25rem; font-weight: 600; cursor: pointer; font-size: .9rem; height: 48px; }
    #input-row button:hover { background: #0369a1; }
    #input-row button:disabled { background: #94a3b8; cursor: default; }

    #mic-btn { width: 48px; padding: 0; font-size: 1.2rem; flex-shrink: 0; transition: background .2s; }
    #mic-btn.recording { background: #dc2626; animation: pulse-red 1s ease-in-out infinite; }
    #mic-btn.recording:hover { background: #b91c1c; }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,.5); }
      50%       { box-shadow: 0 0 0 6px rgba(220,38,38,0); }
    }


    #voice-status { font-size: .75rem; color: #94a3b8; padding: .15rem .5rem; white-space: nowrap; font-style: italic; min-width: 60px; }
  </style>
</head>
<body>
  <header>
    <span>Humana Resolve</span>
  </header>

  <div id="messages">
    <div class="bubble agent">Hi! I'm the Humana Resolve AI assistant. Ask me about a claim, benefits, coverage, or anything else I can help with.</div>
  </div>

  <div id="input-row">
    <button id="mic-btn" title="Start voice input">🎤</button>
    <textarea id="input" placeholder="Type a message… (Enter to send, Shift+Enter for new line)"></textarea>
    <span id="voice-status"></span>
    <button id="send-btn" onclick="send()">Send</button>
  </div>

  <script>
    let sessionId     = null;
    let isRecording   = false;
    let mediaRecorder = null;
    let audioChunks   = [];
    let audioCtx      = null;   // Web Audio API context — unlocked on first gesture

    const input      = document.getElementById('input');
    const sendBtn    = document.getElementById('send-btn');
    const micBtn     = document.getElementById('mic-btn');
    const voiceStat  = document.getElementById('voice-status');
    const msgs       = document.getElementById('messages');

    // Must be called inside a user-gesture handler so the AudioContext is
    // granted autoplay permission. Once unlocked it stays unlocked forever,
    // even across async boundaries like fetch().
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    // ── Mic recording ────────────────────────────────────────────────────────
    micBtn.addEventListener('click', toggleRecording);

    async function toggleRecording() {
      unlockAudio(); // called synchronously inside the click handler
      if (isRecording) {
        mediaRecorder.stop();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks  = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          setRecording(false);
          await processAudio(new Blob(audioChunks, { type: 'audio/webm;codecs=opus' }));
        };
        mediaRecorder.start();
        setRecording(true);
      } catch {
        alert('Microphone access denied. Please allow mic access and try again.');
      }
    }

    function setRecording(val) {
      isRecording = val;
      micBtn.classList.toggle('recording', val);
      micBtn.title = val ? 'Stop recording' : 'Start voice input';
      setStatus(val ? 'Listening…' : '');
    }

    async function processAudio(blob) {
      setStatus('Transcribing…');
      micBtn.disabled = true;
      try {
        const fd = new FormData();
        fd.append('audio', blob, 'recording.webm');
        const res  = await fetch('/stt', { method: 'POST', body: fd });
        const data = await res.json();
        const text = data.transcript?.trim();
        if (text) {
          await send(text);
        } else {
          setStatus('No speech detected');
          setTimeout(() => setStatus(''), 2000);
        }
      } catch {
        addBubble('agent', 'Error: could not transcribe audio.');
        setStatus('');
      }
      micBtn.disabled = false;
    }

    // ── TTS playback — edge-tts neural voice via /tts endpoint ──────────────
    async function speakText(text) {
      setStatus('Speaking…');
      try {
        const res = await fetch('/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) { setStatus(''); return; }
        const buf     = await res.arrayBuffer();
        const decoded = await audioCtx.decodeAudioData(buf);
        const src     = audioCtx.createBufferSource();
        src.buffer    = decoded;
        src.connect(audioCtx.destination);
        src.onended   = () => setStatus('');
        src.start(0);
      } catch (e) {
        console.error('TTS error:', e);
        setStatus('');
      }
    }

    function setStatus(msg) { voiceStat.textContent = msg; }

    // ── Chat ─────────────────────────────────────────────────────────────────
    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = `bubble ${role}`;
      div.textContent = text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    async function send(overrideText) {
      unlockAudio(); // unlock on Send button click too
      const text = overrideText ?? input.value.trim();
      if (!text) return;

      if (!overrideText) input.value = '';
      sendBtn.disabled = true;
      addBubble('user', text);
      const thinking = addBubble('agent thinking', 'Thinking…');
      setStatus('Thinking…');

      try {
        const res  = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const data = await res.json();
        sessionId = data.session_id;
        thinking.textContent = data.reply;
        thinking.classList.remove('thinking');
        await speakText(data.reply);
      } catch {
        thinking.textContent = 'Error: could not reach the server.';
        setStatus('');
      }

      sendBtn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
